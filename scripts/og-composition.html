<!doctype html>
<!--
	Composition de l'image de partage de l'accueil (public/og.png, public/og.en.png, 1200×630),
	remplie et capturée par `pnpm og:capture` pour chaque langue, puis versionnée. Hors de src/pages
	et de public : elle n'est pas publiée. Les champs entre signes pour cent viennent du module
	d'identité (src/data/profile.ts, shareCaption) ; le texte alternatif de l'image y est décrit
	(pageMeta.<langue>.shareImage.alt) : les garder d'accord.
-->
<html lang="%LANG%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=1200" />
		<title>Image de partage</title>
		<!-- Polices chargées depuis Google le temps de la capture : l'axe wdth donne la condensée. -->
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Fragment+Mono&display=block"
		/>
		<style>
			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #f3f3ef;
				color: #111110;
			}

			body {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 52px 64px 56px;
				font-family: 'Archivo', sans-serif;
			}

			.mono {
				font-family: 'Fragment Mono', monospace;
			}

			.topline {
				display: flex;
				justify-content: space-between;
				font-size: 22px;
				color: #5f5f5a;
			}

			.mode {
				color: #111110;
			}

			h1 {
				margin: 0;
				font-size: 236px;
				line-height: 0.8;
				font-weight: 800;
				font-stretch: 62%;
				letter-spacing: -0.015em;
				text-transform: uppercase;
			}

			h1 span {
				display: block;
				white-space: nowrap;
			}

			.cursor {
				display: inline-block;
				width: 0.3em;
				height: 0.7em;
				margin-left: 0.05em;
				background: #2433ff;
			}

			.subtitle {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				margin: 0;
				padding-top: 20px;
				border-top: 2px solid #111110;
				font-size: 24px;
			}

			.city {
				color: #2433ff;
			}
		</style>
	</head>
	<body>
		<div class="mono topline">
			<span class="mode">-- NORMAL --</span>
			<span>portfolio · 2026</span>
		</div>
		<h1>
			<span>Louis</span>
			<span>Pocheron<i class="cursor"></i></span>
		</h1>
		<p class="mono subtitle">
			<span>%ROLE%</span>
			<span class="city">%PLACE%</span>
		</p>
	</body>
</html>
